[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-gather"
version = "0.1.0"
description = "LLM-style web scraper - crawls feeds, sitemaps and links, cleans pages into readable articles (no site-specific selectors), and builds a plain-text corpus. Everything free, no API keys."
authors = [{ name = "Hindham A.F" }]
license = { text = "Free-to-Use License 1.0 - see LICENSE (free to use/modify; not for standalone resale)" }
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "trafilatura",
    "readability-lxml",
    "feedparser",
    "beautifulsoup4",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
webgather = "web_gather.cli:app"

[tool.setuptools]
packages = ["web_gather"]